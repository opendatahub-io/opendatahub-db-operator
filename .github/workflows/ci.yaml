name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROLLER_GEN_VERSION: v0.17.0
  KUSTOMIZE_VERSION: v5.5.0
  GOLANGCI_LINT_VERSION: v2.6.0
  SETUP_ENVTEST_VERSION: release-0.20
  ENVTEST_K8S_VERSION: "1.31.0"
  HELM_VERSION: v3.19.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify lint config
        run: golangci-lint config verify

      - name: Run golangci-lint
        run: golangci-lint run

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install controller-gen, kustomize, and golangci-lint
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@${{ env.CONTROLLER_GEN_VERSION }}
          go install sigs.k8s.io/kustomize/kustomize/v5@${{ env.KUSTOMIZE_VERSION }}
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build manager binary
        run: make build

  verify-manifests:
    name: Verify Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install controller-gen
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@${{ env.CONTROLLER_GEN_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate manifests and deepcopy code
        run: make manifests generate

      - name: Fail on drift between generated and checked-in files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'make manifests generate' produced changes -- run it locally and commit the result:"
            git status --porcelain
            git diff
            exit 1
          fi

  helm:
    name: Helm Chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check Helm version
        run: helm version --short

      - name: Install controller-gen and kustomize
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@${{ env.CONTROLLER_GEN_VERSION }}
          go install sigs.k8s.io/kustomize/kustomize/v5@${{ env.KUSTOMIZE_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate and lint Helm chart
        run: make helm

      - name: Fail on chart generation drift
        run: |
          if [ -n "$(git status --porcelain -- config/chart/)" ]; then
            echo "::error::'make helm' produced changes in config/chart/ -- run it locally and commit the result:"
            git status --porcelain -- config/chart/
            git diff -- config/chart/
            exit 1
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install controller-gen
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@${{ env.CONTROLLER_GEN_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: make test

  envtest:
    name: Envtest Reconciler Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install controller-gen and setup-envtest
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@${{ env.CONTROLLER_GEN_VERSION }}
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@${{ env.SETUP_ENVTEST_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Not run against a real cluster -- test/integration (which needs one)
      # is intentionally excluded here; see Makefile's test-integration-*
      # targets for that suite instead.
      - name: Run envtest-based reconciler suite
        run: make test-envtest ENVTEST_K8S_VERSION=${{ env.ENVTEST_K8S_VERSION }}
