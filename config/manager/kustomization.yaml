resources:
- manager.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: controller
  newName: quay.io/opendatahub/odh-db-operator
  newTag: odh-stable
# Generated (not a static configmap.yaml) so kustomize appends a
# content hash to the name and rewrites manager.yaml's volume reference to
# match. That name change is what forces a new pod template -- and so a
# rollout -- whenever this data changes; a fixed ConfigMap name lets content
# change silently under a running Deployment with no rollout at all.
configMapGenerator:
- name: config
  namespace: system
  literals:
  - platformType=OpenDataHub
  - platformVersion=
  # The operator's ServiceAccount name must match the namePrefix applied
  # by config/default (odh-db-operator- + operator). A custom overlay that
  # changes the namePrefix must also update this literal to match.
  - operator-service-account=odh-db-operator-operator
  options:
    labels:
      app.kubernetes.io/name: opendatahub-db-operator
