apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-db-operator
  name: controller-manager
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opendatahub-db-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Metrics (HTTPS, authn/authz enforced by the metrics server) only from
    # the platform and RHOAI/ODH monitoring namespaces.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-monitoring
                  - openshift-user-workload-monitoring
                  - redhat-ods-monitoring
                  - opendatahub-monitoring
      ports:
        - protocol: TCP
          port: 8443
    # Admission webhooks are called by the API server, which runs on the host
    # network on OpenShift. Health probes (8081) need no rule: NetworkPolicy
    # always allows traffic from the pod's own node, where kubelet probes
    # originate.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
      ports:
        - protocol: TCP
          port: 9443
  # Egress is unrestricted, one of the three explicit behaviors the module
  # NetworkPolicy contract permits (ODH-ADR-Operator-0016): the operator
  # reaches Internal and External PostgreSQL backends and the Kubernetes API
  # server, whose OpenShift endpoints are per-cluster control-plane host IPs
  # that cannot be expressed as stable selectors. The ADR requires this
  # allowance to be documented, as here.
  egress:
    - {}
