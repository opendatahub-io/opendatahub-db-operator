apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-db-operator
    monitoring.opendatahub.io/scrape: "true"
  name: metrics-monitor
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    path: /metrics
    port: https
    scheme: https
    tlsConfig:
      ca:
        configMap:
          key: service-ca.crt
          name: metrics-server-ca
      serverName: odh-db-operator-metrics-service.odh-db-operator-system.svc
  selector:
    matchLabels:
      app.kubernetes.io/name: opendatahub-db-operator
