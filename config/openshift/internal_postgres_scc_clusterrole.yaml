# Grants use of odh-db-internal-postgres. Bound per Internal provider SA via
# a namespaced RoleBinding created by the reconciler.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odh-db-internal-postgres
  labels:
    app.kubernetes.io/name: odh-db-internal-postgres
    app.kubernetes.io/part-of: opendatahub-db-operator
    app.kubernetes.io/component: internal-postgres-scc
    db.infrastructure.opendatahub.io/internal-postgres-scc: owned
rules:
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  resourceNames:
  - odh-db-internal-postgres
  verbs:
  - use
